<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>RC RUMBLE</title>
<!-- Procedural favicon: no asset files anywhere in this project, not even here. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%2305070c'/%3E%3Cpath d='M10 40h44l-5-13H15z' fill='%234aa8ff'/%3E%3Ccircle cx='20' cy='45' r='7' fill='%23dfe8ff'/%3E%3Ccircle cx='44' cy='45' r='7' fill='%23dfe8ff'/%3E%3Cpath d='M50 27V12' stroke='%238affd4' stroke-width='3'/%3E%3Ccircle cx='50' cy='10' r='4' fill='%23ffbf47'/%3E%3C/svg%3E" />
<style>
  :root { color-scheme: dark; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; overflow:hidden; background:#05070c; }
  body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-font-smoothing:antialiased; }
  #app { position:fixed; inset:0; }
  #app canvas { display:block; width:100%; height:100%; touch-action:none; }
  #ui-root { position:fixed; inset:0; pointer-events:none; z-index:10; }
  #boot {
    position:fixed; inset:0; z-index:100; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:22px;
    background:radial-gradient(120% 100% at 50% 0%, #16233d 0%, #05070c 70%);
    color:#dfe8ff; transition:opacity .5s ease; font-weight:600; letter-spacing:.18em;
  }
  #boot.hidden { opacity:0; pointer-events:none; }
  #boot h1 { font-size:clamp(30px,7vw,68px); letter-spacing:.24em; text-shadow:0 0 30px #4aa8ff88; }
  #boot .sub { font-size:11px; opacity:.55; letter-spacing:.4em; }
  #boot .bar { width:min(420px,60vw); height:3px; background:#ffffff18; border-radius:2px; overflow:hidden; }
  #boot .bar i { display:block; height:100%; width:0%; background:linear-gradient(90deg,#4aa8ff,#8affd4); transition:width .25s ease; }
  #boot .msg { font-size:10px; opacity:.45; letter-spacing:.22em; height:1em; }
  #boot .err { color:#ff8a8a; font-size:12px; max-width:70vw; text-align:center; letter-spacing:.04em;
               font-family:ui-monospace,Menlo,monospace; white-space:pre-wrap; }
</style>
</head>
<body>
  <div id="app"></div>
  <div id="ui-root"></div>
  <div id="boot">
    <h1>RC RUMBLE</h1>
    <div class="sub">RADIO CONTROLLED MAYHEM</div>
    <div class="bar"><i id="boot-bar"></i></div>
    <div class="msg" id="boot-msg">booting</div>
    <div class="err" id="boot-err"></div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
